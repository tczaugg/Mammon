# Quicken tax line items, as a Mammon report definition.
#
# WHERE THE NAMES COME FROM
#   * The 44 lines carrying an `export.txf_refnum` were sourced from Quicken
#     itself: the distinct `R` values appearing in the `!Type:Cat` records of
#     Quicken's own QIF exports, each resolved to its form and line
#     description in the published TXF v042 reference-number table
#     (taxdataexchange.org, TXF specification v042). Label text is that
#     table's description verbatim, so a refnum and its label always agree.
#   * The remaining 24 lines are standard Quicken Tax Link entries (Schedule
#     C, Schedule D, Schedule SE, 1099-R, 1099-NEC and a few Form 1040 and
#     Schedule A lines) that no `R` value covered. Their TXF reference
#     numbers could not be established from the QIF exports or the v042
#     table, so the `export:` block is OMITTED rather than guessed: a
#     wrong refnum silently files a number on the wrong line. Add the block by
#     hand once you have the number, or leave it off and read the figure from
#     the report.
#   * QIF category records store only the numeric `R` refnum, never a
#     tax-line NAME, so no name here was lifted from the ledger. This file
#     contains tax line names, labels, groups and reference numbers and
#     nothing else -- no amounts, no accounts, no payees, no personal names.
#
# WHAT IT IS FOR
#   Create Tax Report over this definition gives you every line with NO
#   category selections; the unassigned lines are the to-do list. `year` and
#   `default_range` only pick the default period -- the line NAMES are not
#   year-specific, so copy this file into your own report-definitions
#   directory and edit it there if you need a line this one got wrong.
#
# Signs follow Mammon's convention for a tax report: +1 on a line that
# reports income or a receipt, -1 on a line that reports an expense, a
# deduction or an amount withheld, so each line reads as a positive figure.

